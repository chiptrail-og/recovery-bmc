[project]
name = "recovery-bmc"
version = "0.1.0"
description = "Unified OCP Recovery BMC agent over USB or I3C"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyusb>=1.2.1",
]

[project.scripts]
recovery-bmc = "recovery_bmc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/recovery_bmc"]

[tool.hatch.build.targets.wheel.sources]
src = ""

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
